<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INTERCITLY</title>
    <!-- Importamos la librería pdf-lib desde CDN -->
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <style>
        :root {
            --primary: #ffc72c;
            --primary-hover: #e5b327;
            --bg: #f4f5f7;
            --card-bg: #ffffff;
            --text: #1a1a1a;
            --text-light: #555555;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .top-header {
            background-color: var(--primary);
            color: #1a1a1a;
            padding: 1rem 2rem;
            font-weight: 800;
            font-size: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            letter-spacing: 0.5px;
        }

        .sub-header {
            background-color: #1a1a1a;
            color: #ffffff;
            padding: 0.75rem 2rem;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .bottom-footer {
            background-color: #1a1a1a;
            color: #888888;
            text-align: center;
            padding: 1rem;
            font-size: 0.8rem;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }

        .btn-redirect {
            display: inline-block;
            margin-top: 2rem;
            padding: 1rem 3rem;
            background: var(--primary);
            color: #1a1a1a;
            text-decoration: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 800;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background 0.2s ease, transform 0.1s ease;
        }
        .btn-redirect:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
        }

        .container {
            background: var(--card-bg);
            width: 100%;
            max-width: 650px;
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            text-align: center;
            color: #0f172a;
        }

        p.subtitle {
            text-align: center;
            color: var(--text-light);
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }

        /* Zona de Arrastre (Dropzone) */
        .dropzone {
            border: 2px dashed var(--border);
            border-radius: 12px;
            padding: 2rem 1rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            background: #fdfdfd;
        }

        .dropzone.dragover {
            border-color: var(--primary);
            background: #eef2ff;
        }

        .dropzone svg {
            width: 48px;
            height: 48px;
            fill: var(--text-light);
            margin-bottom: 0.5rem;
        }

        .dropzone span {
            display: block;
            font-weight: 600;
            color: var(--primary);
        }

        .dropzone small {
            color: var(--text-light);
            font-size: 0.8rem;
        }

        #fileInput {
            display: none;
        }

        /* Lista de Archivos */
        .file-section {
            margin-top: 1.5rem;
            display: none;
        }

        .file-section h3 {
            font-size: 0.95rem;
            margin-bottom: 0.75rem;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .file-list {
            list-style: none;
            max-height: 250px;
            overflow-y: auto;
            border: 1px solid var(--border);
            border-radius: 8px;
            divide-y: 1px solid var(--border);
        }

        .file-item {
            padding: 0.75rem 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.9rem;
            border-bottom: 1px solid var(--border);
            background: #fff;
        }

        .file-item:last-child {
            border-bottom: none;
        }

        .file-order {
            background: var(--primary);
            color: #1a1a1a;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: bold;
            margin-right: 0.75rem;
            flex-shrink: 0;
        }

        .file-name {
            flex-grow: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Botón de Acción */
        .btn {
            width: 100%;
            padding: 0.85rem;
            margin-top: 1.5rem;
            background: var(--primary);
            color: #1a1a1a;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .btn:hover {
            background: var(--primary-hover);
        }

        .btn:disabled {
            background: #cbd5e1;
            cursor: not-allowed;
        }

        /* Indicador de Estado */
        #status {
            margin-top: 1rem;
            text-align: center;
            font-size: 0.9rem;
            font-weight: 500;
        }
        .success { color: #16a34a; }
        .processing { color: var(--primary); }
    </style>
</head>
<body>

    <!-- Header Amarillo -->
    <header class="top-header">
        <div>INTERCITLY <span style="font-weight:400; font-size:1rem;">1.0</span></div>
        <div style="font-size:0.9rem; font-weight:600; display:flex; align-items:center; gap:5px; cursor:pointer;">
            <svg style="width:16px;height:16px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
            Contact Us
        </div>
    </header>

    <!-- Sub-header Negro -->
    <nav class="sub-header">
        <span>PDF UNIFIER</span>
    </nav>

    <!-- Contenido Principal -->
    <main class="main-content">
        <div class="container" style="text-align: center; max-width: 900px; padding: 1.5rem 2rem;">
            <img src="standby.png" alt="Technical Difficulties - Please Stand By" style="max-height: 350px; width: auto; border-radius: 8px; margin-bottom: 1.5rem; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
            
            <p style="font-size: 1.2rem; font-weight: 500; color: var(--text); margin-bottom: 0.5rem;">
                The PDF unification tool has moved to the <strong>UNIFYING</strong> tab in <strong>INTERGUIDE</strong>.
            </p>
            <p style="font-size: 0.95rem; color: var(--text-light);">
                La función de unir PDFs se ha mudado a la pestaña de <strong>UNIFYING</strong> en <strong>INTERGUIDE</strong>.
            </p>
        </div>

        <a href="https://wildersican.github.io/interguide/" class="btn-redirect">
            Let's go to INTERGUIDE <br> <span style="font-size: 0.9rem; font-weight: 500;">Vamos a INTERGUIDE</span>
        </a>
    </main>

    <!-- Footer Negro -->
    <footer class="bottom-footer">
        &copy; 2026 INTERCITLY | By WilderSican
    </footer>
</body>
</html>
